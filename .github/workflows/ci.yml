name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install deps
        run: |
          uv venv --python 3.12 .venv
          uv pip install -e ".[test]"
      - name: Run test suite
        run: .venv/bin/python -m pytest -q --ignore=tests/benchmark

  engine-benchmarks:
    # Standing regression gate: exact engine results vs pinned SCRAM/OpenFTA
    # reference values (17 standard PSA benchmarks incl. Aralia trees).
    name: Engine benchmark corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install deps
        run: |
          uv venv --python 3.12 .venv
          uv pip install -e ".[test]"
      - name: Run benchmark suite
        run: .venv/bin/python -m pytest -q tests/benchmark

  cudd-parity:
    # dd.cudd compiled from source with CUDD (--fetch --cudd). First Linux run
    # passed 2026-07-15 -> promoted to a BLOCKING gate (parity Gap 6b closed).
    name: CUDD backend parity (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: pip install -e ".[test]" cython
      - name: Build dd with CUDD backend
        run: |
          pip download dd --no-deps --no-binary :all: -d /tmp/dd-src
          cd /tmp/dd-src
          tar xzf dd-*.tar.gz
          cd dd-*/
          python setup.py install --fetch --cudd
      - name: Run parity tests
        run: python -m pytest -q tests/test_dd_parity.py

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
