[project]
name = "bess-psa"
version = "0.1.0"
description = "Exact BDD/ZBDD PSA engine for BESS thermal-runaway QRA"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6", "dd>=0.6", "httpx>=0.27"]

[project.scripts]
bpsa = "psaengine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
markers = [
    "benchmark: standard-PSA benchmark corpus checks (engine vs reference values)",
]

[tool.setuptools.packages.find]
include = ["psaengine*", "bess*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
